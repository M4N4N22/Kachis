<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kachis</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0a0a;
        --surface: #131313;
        --ink: #f2f2f4;
        --muted: #8b8b96;
        --line: color-mix(in srgb, #f2f2f4 12%, transparent);
        --brand-a: #1e00ff;
        --brand-b: #d765e6;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 320px;
        background: var(--bg);
        color: var(--ink);
        font: 12px/1.45 "DM Sans", ui-sans-serif, system-ui, sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 14px 10px;
        border-bottom: 1px solid var(--line);
      }
      header img {
        width: 28px;
        height: 28px;
        border-radius: 8px;
      }
      header .title {
        flex: 1;
        min-width: 0;
      }
      header h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      header p {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 10px;
      }
      .switch {
        position: relative;
        width: 36px;
        height: 20px;
        flex-shrink: 0;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .switch span {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: color-mix(in srgb, var(--ink) 16%, transparent);
        cursor: pointer;
        transition: 0.15s ease;
      }
      .switch span::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--ink);
        transition: 0.15s ease;
      }
      .switch input:checked + span {
        background: linear-gradient(135deg, var(--brand-a), var(--brand-b));
      }
      .switch input:checked + span::after {
        transform: translateX(16px);
      }
      section {
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
      }
      section h2 {
        margin: 0 0 8px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .pack {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 0;
        border-top: 1px solid var(--line);
      }
      .pack:first-of-type {
        border-top: 0;
        padding-top: 0;
      }
      .pack label {
        display: block;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
      }
      .pack .helper {
        margin-top: 2px;
        font-size: 10px;
        color: var(--muted);
        line-height: 1.35;
      }
      label.field {
        display: block;
        font-size: 10px;
        font-weight: 600;
        color: var(--muted);
        margin: 0 0 4px;
      }
      input[type="url"],
      input[type="password"],
      input[type="text"] {
        width: 100%;
        margin-bottom: 10px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--ink);
        font: inherit;
      }
      input:focus {
        outline: 1px solid color-mix(in srgb, var(--brand-a) 55%, transparent);
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      button {
        appearance: none;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 7px 12px;
        background: var(--surface);
        color: var(--ink);
        font: 600 11px/1 inherit;
        cursor: pointer;
      }
      button.primary {
        border: 0;
        background: linear-gradient(135deg, var(--brand-a), var(--brand-b));
        color: #fff;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #status {
        padding: 10px 14px 14px;
        font-size: 10px;
        color: var(--muted);
        min-height: 2.4em;
      }
      a.link {
        color: var(--ink);
        text-decoration: underline;
        text-underline-offset: 2px;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/icon48.png" alt="" width="28" height="28" />
      <div class="title">
        <h1>Kachis</h1>
        <p>Shield ChatGPT on this device</p>
      </div>
      <label class="switch" title="Enable companion">
        <input id="enabled" type="checkbox" checked />
        <span></span>
      </label>
    </header>

    <section>
      <h2>Packs</h2>
      <div id="packs"></div>
    </section>

    <section>
      <h2>Console</h2>
      <label class="field" for="consoleUrl">Console URL</label>
      <input id="consoleUrl" type="url" placeholder="http://localhost:3000" />
      <label class="field" for="seatKey">Seat key (optional)</label>
      <input id="seatKey" type="password" autocomplete="off" />
      <div class="actions">
        <button type="button" class="primary" id="save">Save</button>
        <button type="button" id="verify">Verify</button>
        <a class="link" href="#" id="openOptions">Full settings</a>
      </div>
    </section>

    <div id="status"></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
